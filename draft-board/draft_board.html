<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; }

.db-root {
  --db-bg: #F4EFE1;
  --db-panel: #EAE2CE;
  --db-panel-2: #DFD5BC;
  --db-line: #C9BC9C;
  --db-line-soft: #D9CDAD;
  --db-chalk: #2E2A20;
  --db-muted: #7A7360;
  --db-gold: #A8763A;
  --db-gold-dim: #8A6230;
  --db-pos: #3E7A52;
  --db-neg: #A8452F;
  --db-round: #B3A47D;
  --db-drafted: #9A8F72;

  font-family: 'Inter', sans-serif;
  background: var(--db-bg);
  color: var(--db-chalk);
  border-radius: 14px;
  padding: 24px;
  max-width: 900px;
  margin: 0 auto;
}

.db-root .db-mono { font-family: 'IBM Plex Mono', monospace; }
.db-root .db-display { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.02em; }

.db-root ::selection { background: var(--db-gold); color: var(--db-bg); }
</style>

<div class="db-root">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Interactive 2026 PPR fantasy football draft board with VORP rankings by position and per-player notes</h2>

  <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:8px;">
    <div class="db-display" style="font-size:22px; text-transform:uppercase; color:var(--db-chalk);">2026 Draft Board</div>
    <div class="db-mono" style="font-size:12px; color:var(--db-muted);">12-team superflex &middot; full PPR &middot; VORP ranked</div>
  </div>
  <div style="height:1px; background:var(--db-line); margin:14px 0 18px;"></div>

  <div style="border:0.5px solid var(--db-line); border-radius:10px; margin-bottom:18px; overflow:hidden;">
    <button id="db-general-notes-toggle" class="db-mono" style="width:100%; text-align:left; background:var(--db-panel); border:none; color:var(--db-chalk); padding:10px 14px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:8px;">
      <i class="ti ti-chevron-right" id="db-general-notes-chevron" aria-hidden="true" style="font-size:13px; transition:transform 0.15s;"></i>
      General Notes
      <span id="db-general-notes-dot" style="width:5px; height:5px; border-radius:50%; background:var(--db-gold); display:none;"></span>
    </button>
    <div id="db-general-notes-body" style="display:none; padding:0 14px 14px;">
      <textarea id="db-general-notes" placeholder="Overall draft strategy, targets, reminders..." style="width:100%; min-height:90px; background:var(--db-bg); border:0.5px solid var(--db-line); color:var(--db-chalk); border-radius:8px; padding:10px 12px; font-family:'Inter',sans-serif; font-size:13px; resize:vertical; outline:none;"></textarea>
    </div>
  </div>

  <div id="db-tabs" style="display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;"></div>

  <div style="display:flex; gap:8px; margin-bottom:16px;">
    <input id="db-search" type="text" placeholder="Search player" style="flex:1; background:var(--db-panel); border:0.5px solid var(--db-line); color:var(--db-chalk); padding:9px 12px; border-radius:8px; font-family:'Inter',sans-serif; font-size:13px; outline:none;" />
    <select id="db-team-filter" class="db-mono" style="background:var(--db-panel); border:0.5px solid var(--db-line); color:var(--db-chalk); padding:9px 10px; border-radius:8px; font-size:12px; cursor:pointer;"></select>
    <button id="db-sort-btn" class="db-mono" style="background:var(--db-panel); border:0.5px solid var(--db-line); color:var(--db-chalk); padding:9px 14px; border-radius:8px; font-size:12px; cursor:pointer; white-space:nowrap;">Sort: VORP</button>
  </div>

  <label class="db-mono" style="display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:12px; color:var(--db-muted); cursor:pointer; width:fit-content;">
    <input id="db-hide-drafted" type="checkbox" style="accent-color:var(--db-gold); width:14px; height:14px; cursor:pointer;" />
    Hide drafted players
  </label>

  <div style="display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
    <input id="db-sleeper-id" type="text" placeholder="Sleeper draft ID" style="width:220px; background:var(--db-panel); border:0.5px solid var(--db-line); color:var(--db-chalk); padding:8px 10px; border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none;" />
    <button id="db-sleeper-btn" class="db-mono" style="background:var(--db-panel); border:0.5px solid var(--db-line); color:var(--db-chalk); padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; white-space:nowrap;">Connect to Sleeper</button>
    <button id="db-refresh-btn" class="db-mono" style="background:var(--db-panel); border:0.5px solid var(--db-line); color:var(--db-chalk); padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; white-space:nowrap;">Refresh Now</button>
    <span id="db-sleeper-status" class="db-mono" style="font-size:11px; color:var(--db-muted);"></span>
    <button id="db-reset-btn" class="db-mono" style="margin-left:auto; background:transparent; border:0.5px solid var(--db-neg); color:var(--db-neg); padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; white-space:nowrap;">Reset Draft</button>
  </div>

  <div style="border:0.5px solid var(--db-line); border-radius:10px; margin-bottom:18px; overflow:hidden;">
    <button id="db-grade-toggle" class="db-mono" style="width:100%; text-align:left; background:var(--db-panel); border:none; color:var(--db-chalk); padding:10px 14px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:600;">
      <i class="ti ti-chevron-right" id="db-grade-chevron" aria-hidden="true" style="font-size:13px; transition:transform 0.15s;"></i>
      My Draft Grade
    </button>
    <div id="db-grade-body" style="display:none; padding:14px;">
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
        <input id="db-my-slot" type="number" min="1" max="12" placeholder="My slot #" style="width:100px; background:var(--db-panel); border:0.5px solid var(--db-line); color:var(--db-chalk); padding:8px 10px; border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none;" />
        <button id="db-grade-btn" class="db-mono" style="background:var(--db-gold); border:none; color:var(--db-bg); padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:600; white-space:nowrap;">Grade My Draft</button>
        <span id="db-grade-status" class="db-mono" style="font-size:11px; color:var(--db-muted);"></span>
      </div>
      <div id="db-grade-results" style="display:none;"></div>
    </div>
  </div>

  <div id="db-table"></div>

  <div id="db-empty" style="display:none; text-align:center; padding:40px 0; color:var(--db-muted); font-size:13px;">No players match that search.</div>
</div>

      btn.textContent = pos + ' (' + count + ')';
      btn.onclick = () => { activeTab = pos; expanded = null; render(); };
      tabsEl.appendChild(btn);
    });
  }

    let list = getTabBase(activeTab);
    if (teamFilter !== 'ALL') {

      list = list.filter(p => !drafted[p.Player]);
    }
    list.sort((a, b) => (b[sortKey] ?? -Infinity) - (a[sortKey] ?? -Infinity));
    return list;
  }

    const base = getTabBase(activeTab);
    base.sort((a, b) => (b[sortKey] ?? -Infinity) - (a[sortKey] ?? -Infinity));

  // --- Sleeper live draft sync ---
  function cleanNameJS(name) {
    return (name || '').replace(/\s+(Jr\.?|Sr\.?|II|III|IV)$/i, '').trim().toLowerCase();
  }

  const cleanedNameMap = {};
  PLAYERS.forEach(p => { cleanedNameMap[cleanNameJS(p.Player)] = p.Player; });

  let sleeperDraftId = null;
  let sleeperInterval = null;
  const sleeperStatusEl = document.getElementById('db-sleeper-status');
  const sleeperInputEl = document.getElementById('db-sleeper-id');
  const sleeperBtnEl = document.getElementById('db-sleeper-btn');

  function setSleeperStatus(text) {
    sleeperStatusEl.textContent = text;
  }

  async function pollSleeperDraft() {
    try {
      const res = await fetch('https://api.sleeper.app/v1/draft/' + sleeperDraftId + '/picks');
      if (!res.ok) throw new Error('bad response');
      const picks = await res.json();
      let changed = false;
      picks.forEach(pick => {
        const meta = pick.metadata || {};
        const full = (meta.first_name || '') + ' ' + (meta.last_name || '');
        const key = cleanedNameMap[cleanNameJS(full)];
        if (key && !drafted[key]) {
          drafted[key] = true;
          changed = true;
        }
      });
      if (changed) { saveDrafted(); render(); }
      setSleeperStatus('Connected \u2014 ' + picks.length + ' picks synced \u00b7 last checked ' + new Date().toLocaleTimeString());
    } catch (e) {
      setSleeperStatus('Could not reach Sleeper \u2014 will retry');
    }
  }

  const playerByName = {};
  PLAYERS.forEach(p => { playerByName[p.Player] = p; });

  const posSorted = {};
  ['QB', 'RB', 'WR', 'TE'].forEach(pos => {
    posSorted[pos] = PLAYERS.filter(p => p.POS === pos).sort((a, b) => b.VORP - a.VORP);
  });

  // Scarcity drop-off: how much VORP you'd lose at this position by waiting
  // one round-equivalent (12 players, matching our 12-team round chart) longer.
  function scarcityDropoff(pos, playerName) {
    const list = posSorted[pos];
    if (!list) return null;
    const idx = list.findIndex(p => p.Player === playerName);
    if (idx === -1) return null;
    const nextIdx = Math.min(idx + 12, list.length - 1);
    return list[idx].VORP - list[nextIdx].VORP;
  }

  function scarcityTag(dropoff) {
    if (dropoff == null) return { label: '\u2014', color: 'var(--db-muted)' };
    if (dropoff >= 15) return { label: 'High scarcity \u2014 great timing', color: 'var(--db-pos)' };
    if (dropoff >= 7) return { label: 'Moderate scarcity', color: 'var(--db-muted)' };
    return { label: 'Low scarcity \u2014 could\u2019ve waited', color: 'var(--db-neg)' };
  }

  function gradeTag(delta) {
    if (delta >= 3) return { label: 'Steal', color: 'var(--db-pos)' };
    if (delta >= 2) return { label: 'Good Value', color: 'var(--db-pos)' };
    if (delta >= -1) return { label: 'Fair', color: 'var(--db-muted)' };
    if (delta >= -3) return { label: 'Slight Reach', color: 'var(--db-neg)' };
    return { label: 'Reach', color: 'var(--db-neg)' };
  }

  // Component 3: Team Value — best possible starting lineup (QB,RB,RB,WR,WR,TE,FLEX,SUPERFLEX) by VORP.
  // Calibrated against the real player pool: replacement baseline = 0, a realistic solid team \u2248 350, elite \u2248 1000+.
  function bestLineupVorp(roster) {
    const pool = roster.slice();
    function takeBest(pos, n) {
      const cands = pool.filter(p => p.POS === pos).sort((a, b) => b.VORP - a.VORP).slice(0, n);
      cands.forEach(c => { const i = pool.indexOf(c); if (i > -1) pool.splice(i, 1); });
      return cands;
    }
    const qb = takeBest('QB', 1), rb = takeBest('RB', 2), wr = takeBest('WR', 2), te = takeBest('TE', 1);
    const flexPool = pool.filter(p => ['RB','WR','TE'].includes(p.POS)).sort((a,b) => b.VORP - a.VORP);
    const flex = flexPool.slice(0, 1);
    flex.forEach(f => { const i = pool.indexOf(f); if (i > -1) pool.splice(i, 1); });
    const superflex = pool.sort((a,b) => b.VORP - a.VORP).slice(0, 1);
    const starters = qb.concat(rb, wr, te, flex, superflex);
    return { total: starters.reduce((s, p) => s + p.VORP, 0), starters };
  }

  function teamValueTier(total) {
    if (total >= 600) return { label: 'Elite roster value', color: 'var(--db-pos)' };
    if (total >= 450) return { label: 'Strong roster value', color: 'var(--db-pos)' };
    if (total >= 250) return { label: 'Solid, average value', color: 'var(--db-muted)' };
    if (total >= 100) return { label: 'Below-average value', color: 'var(--db-neg)' };
    return { label: 'Weak roster value', color: 'var(--db-neg)' };
  }

  // Component 4: Roster Balance — real depth check against superflex-league starting needs.
  function rosterBalance(roster) {
    const targets = { QB: 2, RB: 4, WR: 4, TE: 1 };
    const counts = { QB: 0, RB: 0, WR: 0, TE: 0 };
    roster.forEach(p => { if (p.VORP > 0 && counts[p.POS] != null) counts[p.POS]++; });
    const fractions = Object.keys(targets).map(pos => Math.min(counts[pos] / targets[pos], 1));
    const score = fractions.reduce((a,b) => a+b, 0) / fractions.length;
    return { score, counts, targets };
  }

  function balanceTier(score) {
    if (score >= 0.9) return { label: 'Excellent depth at every position', color: 'var(--db-pos)' };
    if (score >= 0.7) return { label: 'Good depth, minor gaps', color: 'var(--db-muted)' };
    if (score >= 0.5) return { label: 'Uneven \u2014 real gaps in your roster', color: 'var(--db-neg)' };
    return { label: 'Poor balance \u2014 punted a position too hard', color: 'var(--db-neg)' };
  }

  function letterGrade(avg) {
    if (avg >= 1.25) return 'A+';
    if (avg >= 0.75) return 'A';
    if (avg >= 0.35) return 'B+';
    if (avg >= 0.1) return 'B';
    if (avg >= -0.15) return 'B-';
    if (avg >= -0.5) return 'C';
    if (avg >= -1) return 'D';
    return 'F';
  }

  function gradeContext(rows, avgDelta, grade, teamValueTotal, balance) {
    const strongVorpReaches = rows.filter(r => r.delta != null && r.delta < -1 && r.vorp != null && r.vorp > 30);
    const highTiming = rows.filter(r => r.dropoff != null && r.dropoff >= 15);
    let text = 'This grade blends four things: value vs. the real market (ADP), positional scarcity timing (from the round-decline chart), your best lineup\u2019s total VORP (Team Value), and how well-stocked your roster is at every position (Roster Balance).';
    if (highTiming.length > 0) {
      text += ' Your strongest scarcity-timing picks: ' + highTiming.map(r => r.name + ' (' + r.pos + ')').join(', ') + '.';
    }
    if (strongVorpReaches.length > 0) {
      text += ' ' + strongVorpReaches.map(r => r.name).join(', ') + ' show as reaches by pure ADP but carry strong VORP \u2014 often still the right call.';
    }
    const gaps = Object.keys(balance.targets).filter(pos => balance.counts[pos] < balance.targets[pos]);
    if (gaps.length > 0) {
      text += ' Positions still needing depth: ' + gaps.map(pos => pos + ' (' + balance.counts[pos] + '/' + balance.targets[pos] + ')').join(', ') + '.';
    }
    return text;
  }

  async function gradeMyDraft() {
    const gradeStatusEl = document.getElementById('db-grade-status');
    const resultsEl = document.getElementById('db-grade-results');
    const slotInput = document.getElementById('db-my-slot').value.trim();
    const draftIdInput = sleeperInputEl.value.trim() || sleeperDraftId;

    if (!draftIdInput) {
      gradeStatusEl.textContent = 'Enter and connect a Sleeper draft ID first';
      return;
    }
    if (!slotInput) {
      gradeStatusEl.textContent = 'Enter your draft slot number';
      return;
    }
    const mySlot = parseInt(slotInput, 10);
    gradeStatusEl.textContent = 'Grading...';

    try {
      const res = await fetch('https://api.sleeper.app/v1/draft/' + draftIdInput + '/picks');
      if (!res.ok) throw new Error('bad response');
      const picks = await res.json();
      const myPicks = picks.filter(p => Number(p.draft_slot) === mySlot);

      if (myPicks.length === 0) {
        gradeStatusEl.textContent = 'No picks found for that slot yet';
        resultsEl.style.display = 'none';
        return;
      }

      const rows = myPicks.map(pick => {
        const meta = pick.metadata || {};
        const full = (meta.first_name || '') + ' ' + (meta.last_name || '');
        const key = cleanedNameMap[cleanNameJS(full)];
        const player = key ? playerByName[key] : null;
        const actualRound = pick.round;
        const adpRound = player ? player.ADP_RD : null;
        const delta = (adpRound != null) ? (actualRound - adpRound) : null;
        const dropoff = (player && key) ? scarcityDropoff(player.POS, key) : null;
        return {
          round: actualRound,
          name: full.trim() || '(unknown)',
          pos: player ? player.POS : '-',
          vorp: player ? player.VORP : null,
          adpRound, delta, dropoff
        };
      }).sort((a, b) => a.round - b.round);

      const knownDeltas = rows.filter(r => r.delta != null).map(r => r.delta);
      const avgDelta = knownDeltas.length ? knownDeltas.reduce((a, b) => a + b, 0) / knownDeltas.length : 0;

      const knownDropoffs = rows.filter(r => r.dropoff != null).map(r => r.dropoff);
      const avgDropoff = knownDropoffs.length ? knownDropoffs.reduce((a, b) => a + b, 0) / knownDropoffs.length : 0;
      const scarcityBonusRounds = avgDropoff / 30; // scale: ~30 VORP pts of avoided drop-off \u2248 1 round of bonus value

      const roster = rows.filter(r => r.vorp != null).map(r => ({ POS: r.pos, VORP: r.vorp }));
      const lineup = bestLineupVorp(roster);
      const balance = rosterBalance(roster);

      const draftInProgress = roster.length < 8; // fewer than starting-lineup size \u2014 not enough to fairly judge team shape yet
      const teamValueBonusRounds = draftInProgress ? 0 : (lineup.total - 350) / 150; // 0 = replacement, ~350 = realistic solid team
      const balanceBonusRounds = draftInProgress ? 0 : (balance.score - 0.75) * 4;

      const activeComponents = draftInProgress ? 2 : 4;
      const blendedAvg = (avgDelta + scarcityBonusRounds + teamValueBonusRounds + balanceBonusRounds) / activeComponents;
      const grade = letterGrade(blendedAvg);
      const totalVorp = rows.reduce((sum, r) => sum + (r.vorp || 0), 0);
      const tvTier = draftInProgress ? { label: 'In progress \u2014 needs 8+ picks', color: 'var(--db-muted)' } : teamValueTier(lineup.total);
      const balTier = draftInProgress ? { label: 'In progress \u2014 needs 8+ picks', color: 'var(--db-muted)' } : balanceTier(balance.score);

      let html = '<div style="border:0.5px solid var(--db-line); border-radius:10px; overflow:hidden;">';
      html += '<div style="padding:16px; background:var(--db-panel-2);">';
      html += '<div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:10px;">';
      html += '<div class="db-display" style="font-size:32px; color:var(--db-gold);">' + grade + '</div>';
      html += '<div class="db-mono" style="font-size:11px; color:var(--db-muted);">' + rows.length + ' picks graded &middot; ' + (draftInProgress ? 'blend of 2 components (Team Value & Balance unlock at 8+ picks)' : 'blend of 4 components below') + '</div>';
      html += '</div>';
      html += '<div class="db-mono" style="display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; font-size:11px; color:var(--db-muted); line-height:1.6;">';
      html += '<div>1. ADP Value: <span style="color:var(--db-chalk);">' + (avgDelta >= 0 ? '+' : '') + avgDelta.toFixed(2) + ' rounds</span></div>';
      html += '<div>2. Positional Timing: <span style="color:var(--db-chalk);">' + (scarcityBonusRounds >= 0 ? '+' : '') + scarcityBonusRounds.toFixed(2) + ' rounds</span> (avg ' + avgDropoff.toFixed(1) + ' VORP saved/pick)</div>';
      html += '<div>3. Team Value: <span style="color:' + tvTier.color + ';">' + tvTier.label + '</span>' + (draftInProgress ? '' : ' (' + lineup.total.toFixed(0) + ' starter VORP)') + '</div>';
      html += '<div>4. Roster Balance: <span style="color:' + balTier.color + ';">' + balTier.label + '</span>' + (draftInProgress ? '' : ' (' + Math.round(balance.score*100) + '%)') + '</div>';
      html += '</div></div>';

      html += '<div class="db-mono" style="display:grid; grid-template-columns:50px 1fr 40px 60px 60px 140px 150px; gap:8px; padding:8px 12px; background:var(--db-panel); font-size:10px; color:var(--db-muted); text-transform:uppercase;">' +
        '<div>Rd</div><div>Player</div><div>Pos</div><div style="text-align:right;">VORP</div><div style="text-align:right;">ADP Rd</div><div>vs ADP</div><div>Timing</div></div>';

      rows.forEach(r => {
        const tag = r.delta != null ? gradeTag(r.delta) : { label: 'No ADP data', color: 'var(--db-muted)' };
        const sTag = scarcityTag(r.dropoff);
        html += '<div class="db-mono" style="display:grid; grid-template-columns:50px 1fr 40px 60px 60px 140px 150px; gap:8px; padding:8px 12px; border-top:0.5px solid var(--db-line-soft); font-size:12px; color:var(--db-chalk); align-items:center;">' +
          '<div>' + r.round + '</div><div>' + r.name + '</div><div style="color:var(--db-muted);">' + r.pos + '</div>' +
          '<div style="text-align:right;">' + (r.vorp != null ? r.vorp.toFixed(1) : '\u2014') + '</div>' +
          '<div style="text-align:right; color:var(--db-muted);">' + (r.adpRound != null ? 'R' + r.adpRound : '\u2014') + '</div>' +
          '<div style="color:' + tag.color + ';">' + tag.label + '</div>' +
          '<div style="color:' + sTag.color + '; font-size:11px;">' + sTag.label + '</div></div>';
      });
      html += '</div>';

      html += '<div class="db-mono" style="padding:12px 14px; background:var(--db-panel); border-top:0.5px solid var(--db-line); font-size:11px; color:var(--db-muted); line-height:1.6;">' + gradeContext(rows, avgDelta, grade, lineup.total, balance) + '</div>';
      html += '</div>';

      resultsEl.innerHTML = html;
      resultsEl.style.display = 'block';
      gradeStatusEl.textContent = 'Graded ' + rows.length + ' picks';
    } catch (e) {
      gradeStatusEl.textContent = 'Could not fetch picks \u2014 try again';
    }
  }

  function connectSleeper(id) {
    sleeperDraftId = id;
    try { localStorage.setItem('sleeper-draft-id-2026', id); } catch (e) {}
    sleeperBtnEl.textContent = 'Disconnect';
    setSleeperStatus('Connecting...');
    pollSleeperDraft();
    sleeperInterval = setInterval(pollSleeperDraft, 4000);
  }

  function disconnectSleeper() {
    sleeperDraftId = null;
    clearInterval(sleeperInterval);
    sleeperInterval = null;
    sleeperBtnEl.textContent = 'Connect to Sleeper';
    setSleeperStatus('');
  }

  sleeperBtnEl.addEventListener('click', () => {
    if (sleeperInterval) {
      disconnectSleeper();
    } else {
      const id = sleeperInputEl.value.trim();
      if (id) connectSleeper(id);
    }
  });

  document.getElementById('db-refresh-btn').addEventListener('click', () => {
    if (sleeperDraftId) {
      setSleeperStatus('Refreshing...');
      pollSleeperDraft();
    } else {
      setSleeperStatus('Enter a draft ID and connect first');
    }
  });

  document.getElementById('db-grade-btn').addEventListener('click', gradeMyDraft);

  let gradeSectionOpen = false;
  document.getElementById('db-grade-toggle').addEventListener('click', () => {
    gradeSectionOpen = !gradeSectionOpen;
    document.getElementById('db-grade-body').style.display = gradeSectionOpen ? 'block' : 'none';
    document.getElementById('db-grade-chevron').style.transform = gradeSectionOpen ? 'rotate(90deg)' : 'rotate(0deg)';
  });

  document.getElementById('db-reset-btn').addEventListener('click', () => {
    const ok = confirm('Reset the draft board? This clears every player\'s drafted status back to available. Your notes will NOT be affected.');
    if (!ok) return;
    drafted = {};
    saveDrafted();
    disconnectSleeper();
    try { localStorage.removeItem('sleeper-draft-id-2026'); } catch (e) {}
    sleeperInputEl.value = '';
    document.getElementById('db-my-slot').value = '';
    document.getElementById('db-grade-status').textContent = '';
    document.getElementById('db-grade-results').style.display = 'none';
    document.getElementById('db-grade-results').innerHTML = '';
    render();
  });

  // --- General (non-player-specific) notes ---
  const generalNotesEl = document.getElementById('db-general-notes');
  const generalNotesToggle = document.getElementById('db-general-notes-toggle');
  const generalNotesBody = document.getElementById('db-general-notes-body');
  const generalNotesChevron = document.getElementById('db-general-notes-chevron');
  const generalNotesDot = document.getElementById('db-general-notes-dot');

  function loadGeneralNotes() {
    try {
      const val = localStorage.getItem('general-notes-2026') || '';
      generalNotesEl.value = val;
      generalNotesDot.style.display = val.trim() ? 'inline-block' : 'none';
    } catch (e) {}
  }

  function saveGeneralNotes() {
    try {
      localStorage.setItem('general-notes-2026', generalNotesEl.value);
      generalNotesDot.style.display = generalNotesEl.value.trim() ? 'inline-block' : 'none';
    } catch (e) {}
  }

  let generalNotesOpen = false;
  generalNotesToggle.addEventListener('click', () => {
    generalNotesOpen = !generalNotesOpen;
    generalNotesBody.style.display = generalNotesOpen ? 'block' : 'none';
    generalNotesChevron.style.transform = generalNotesOpen ? 'rotate(90deg)' : 'rotate(0deg)';
  });

  generalNotesEl.addEventListener('blur', saveGeneralNotes);

  loadGeneralNotes();

  loadNotes();
  loadDrafted();
  loadTargets();
  loadAvoided();
  render();

  try {
    const savedId = localStorage.getItem('sleeper-draft-id-2026');
    if (savedId) {
      sleeperInputEl.value = savedId;
      connectSleeper(savedId);
    }
  } catch (e) {}
})();
</script>
